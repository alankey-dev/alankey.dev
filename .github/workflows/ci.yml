name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, build, gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          BASE_URL: https://alankey.dev

      - name: Validate HTML
        run: npm run test:html

      - name: Install Chromium for axe-core and Lighthouse
        run: npx --yes playwright install --with-deps chromium

      - name: Accessibility (axe-core)
        run: npm run test:a11y
        env:
          CHROME_PATH: $(npx --yes playwright path chromium)

      - name: Performance (Lighthouse CI)
        run: npm run test:perf

      - name: Internal links
        run: npm run test:links

      - name: Unit tests
        run: npm run test:unit

      - name: Upload Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14
